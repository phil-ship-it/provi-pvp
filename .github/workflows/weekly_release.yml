name: Weekly Release

on:
  schedule:
    - cron: '0 6 * * 0' # every Sunday, 06:00 UTC
  workflow_dispatch: # allows manually triggering an off-cycle release from the Actions tab

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, needed for generate_release_notes to list commits since the last release
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Build with Gradle
        run: ./gradlew build

      - name: Determine release tag
        id: vars
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: weekly-${{ steps.vars.outputs.date }}
          name: Weekly Build ${{ steps.vars.outputs.date }}
          prerelease: false
          generate_release_notes: true
          files: |
            ./build/libs/*.jar
